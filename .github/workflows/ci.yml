name: CI & Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Scripts & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Ai2Psd_Pro.jsx Presence & Integrity
        run: |
          if (-not (Test-Path "Ai2Psd_Pro.jsx")) {
            throw "Ai2Psd_Pro.jsx is missing!"
          }
          $bytes = (Get-Item "Ai2Psd_Pro.jsx").Length
          Write-Host "Ai2Psd_Pro.jsx found ($bytes bytes)."
          if ($bytes -lt 1000) {
            throw "Ai2Psd_Pro.jsx file appears incomplete!"
          }

      - name: Validate install.ps1 PowerShell Syntax
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Syntax error in install.ps1"
          }
          Write-Host "install.ps1 syntax is valid."
